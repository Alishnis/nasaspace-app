# NASA TEMPO Air Quality Monitor - Docker Compose

services:
  # Main application
  app:
    build: .
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - nasa-tempo-network

  # Redis for caching (optional - app falls back to in-memory cache if unavailable)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - nasa-tempo-network

volumes:
  redis_data:

networks:
  nasa-tempo-network:
    driver: bridge
