name: Publish image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package*.json
      - server.js
      - routes/**
      - services/**
      - middleware/**
      - public/**
      - healthcheck.js
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/alishnis/nasaspace-app:latest
            ghcr.io/alishnis/nasaspace-app:sha-${{ steps.vars.outputs.sha }}
